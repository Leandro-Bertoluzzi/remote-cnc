info:
  name: Execute realtime command
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/cnc/realtime"
  headers:
    - name: x-cnc-session
      value: ""
  body:
    type: json
    data: "{\r\n    \"action\": \"pause\"\r\n}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
