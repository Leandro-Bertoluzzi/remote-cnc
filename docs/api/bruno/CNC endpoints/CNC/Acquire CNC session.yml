info:
  name: Acquire CNC session
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/cnc/session"
  body:
    type: json
    data: |-
      {
          "client_type": "web"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let data = res.body;
        if(!data.session_id) { return; }

        bru.setVar("cncSession", data.session_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
