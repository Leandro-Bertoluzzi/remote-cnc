info:
  name: Release CNC session
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/cnc/session"
  headers:
    - name: x-cnc-session
      value: "{{cncSession}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let http_status = res.status;
        if(http_status != 200) { return; }

        bru.setVar("cncSession", "");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
