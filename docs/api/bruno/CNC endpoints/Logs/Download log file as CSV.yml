info:
  name: Download log file as CSV
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/logs/:log_name/csv"
  params:
    - name: log_name
      value: api.log
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
