info:
  name: Download log file
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/logs/:log_name"
  params:
    - name: log_name
      value: api.log
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
