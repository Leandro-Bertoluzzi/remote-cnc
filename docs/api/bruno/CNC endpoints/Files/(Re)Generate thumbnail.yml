info:
  name: (Re)Generate thumbnail
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/files/:file_id/thumbnail"
  params:
    - name: file_id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
