info:
  name: Upload task
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/tasks"
  body:
    type: json
    data: "{\r

      \    \"file_id\": 1,\r

      \    \"tool_id\": 1,\r

      \    \"material_id\": 1,\r

      \    \"name\": \"My first task\",\r

      \    \"note\": \"Please take into account this... and that...\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
