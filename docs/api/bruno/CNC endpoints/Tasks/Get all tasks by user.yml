info:
  name: Get all tasks by user
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/tasks?status=on_hold"
  params:
    - name: status
      value: on_hold
      type: query
      description: all, pending_approval, on_hold, in_progress, finished, rejected, cancelled
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
