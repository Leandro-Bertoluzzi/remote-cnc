info:
  name: Get all tasks
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/tasks/all"
  params:
    - name: status
      value: on_hold
      type: query
      description: all, pending_approval, on_hold, in_progress, finished, rejected, cancelled
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
