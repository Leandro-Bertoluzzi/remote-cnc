info:
  name: Publish message
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/monitor/messages/:channel"
  params:
    - name: channel
      value: grbl_messages
      type: path
      description: grbl_status, grbl_messages
  body:
    type: json
    data: "{\r

      \    \"message\": \"Un mensaje\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
