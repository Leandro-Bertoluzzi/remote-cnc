info:
  name: Start stream
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/monitor/stream/:channel"
  params:
    - name: channel
      value: grbl_status
      type: path
      description: grbl_status, grbl_responses
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
