[project]
name = "cnc-core"
version = "0.1.0"
description = "Shared core library: database, utilities, schemas, and configuration"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=3.2,<4",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "PyJWT>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "watchdog",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ty.environment]
extra-paths = ["../tests"]
