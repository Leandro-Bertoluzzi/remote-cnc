[project]
name = "cnc-worker"
version = "0.1.0"
description = "CNC worker core logic: G-code parsing, analysis, rendering and CNC task execution"
requires-python = ">=3.12"
dependencies = [
    "cnc-core",
    "matplotlib>=3.10,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.uv.sources]
cnc-core = { workspace = true }

[tool.ty.environment]
extra-paths = ["../tests"]
