[project]
name = "cnc-app-api"
version = "0.1.0"
description = "REST API for CNC admin (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "cnc-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api-app"]

[tool.uv.sources]
cnc-api = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.24,<1",
    "celery-types>=0.22",
]
