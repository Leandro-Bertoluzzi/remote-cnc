[project]
name = "cnc-app-gateway"
version = "0.1.0"
description = "Dedicated CNC Gateway application: exclusive serial connection, priority command queue, session management"
requires-python = ">=3.12"
dependencies = [
    "cnc-core",
    "cnc-gateway",
    "cnc-infrastructure",
    "redis>=5.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway-app"]

[tool.uv.sources]
cnc-core = { workspace = true }
cnc-gateway = { workspace = true }
cnc-infrastructure = { workspace = true }
