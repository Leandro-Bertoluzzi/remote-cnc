[project]
name = "cnc-app-desktop"
version = "0.1.0"
description = "Desktop app for CNC admin (PyQt5)"
requires-python = ">=3.12"
dependencies = [
    "cnc-manager",
    "PyQt5==5.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desktop-app"]

[tool.uv.sources]
cnc-manager = { workspace = true }

[tool.ty.environment]
extra-paths = ["../tests"]

[dependency-groups]
dev = [
    "pytest-qt>=4.4,<5",
    "pyqt5-stubs>=5.15",
    "celery-types>=0.22",
]
