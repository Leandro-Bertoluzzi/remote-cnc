[project]
name = "cnc-infrastructure"
version = "0.1.0"
description = "Shared infrastructure"
requires-python = ">=3.12"
dependencies = [
    "cnc-core",
    "celery[redis]>=5.3,<6",
    "psycopg2-binary>=2.9,<3",
    "pyserial>=3.5,<4",
    "redis>=5.0,<6",
    "SQLAlchemy>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["infrastructure"]

[tool.uv.sources]
cnc-core = { workspace = true }

[tool.ty.environment]
extra-paths = ["../tests"]
