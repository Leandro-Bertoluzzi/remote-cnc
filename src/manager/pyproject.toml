[project]
name = "cnc-manager"
version = "0.1.0"
description = "Manager for CNC admin"
requires-python = ">=3.12"
dependencies = [
    "cnc-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manager"]

[tool.uv.sources]
cnc-core = { workspace = true }

[tool.ty.environment]
extra-paths = ["../tests"]

[dependency-groups]
dev = [
    "pytest-qt>=4.4,<5",
    "pyqt5-stubs>=5.15",
    "celery-types>=0.22",
]
